name: Persistent cargo target
description: >
  Links target/ to a directory kept between runs, one per runner slot and job, so unchanged
  dependencies are not rebuilt. Checkout removes the link, so every job runs this after
  checking out.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Under CARGO_HOME, which each runner slot has its own of and keeps between jobs: a
        # container runner's is a volume of the slot, and a host runner's .../cargo/<slot>.
        # Two runners then never wait on each other's cargo lock, and the size check below
        # clears a directory no other job is using.
        dir="${CARGO_HOME:-$HOME/.cargo}/tidefell-ci-target/${{ github.job }}"
        mkdir -p "$dir"
        # Keep it bounded: start again once it passes 10 GiB.
        if [ "$(du -s --block-size=1G "$dir" | cut -f1)" -gt 10 ]; then
          echo "Clearing $dir, which passed 10 GiB"
          rm -rf "$dir"
          mkdir -p "$dir"
        fi
        rm -rf target
        ln -s "$dir" target
