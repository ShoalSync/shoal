name: Exit criterion

# Phase 8's exit criterion (ADR 0042), on real machines: the Windows runner's partial replica
# pairs with a Linux daemon on a Linux runner, the shell's listing of its folder shows
# placeholders, opening one fetches it, and the two talk directly over the LAN. The two jobs run
# at once and pass each other pairing codes as commit statuses. Not a pull request's check: it
# needs both runners at the same time, and iroh's public relays to meet.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: read

jobs:
  linux:
    name: Linux daemon
    runs-on: ephemeral
    timeout-minutes: 90
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pair, join and serve
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATH="$(nix build --no-link --print-out-paths --print-build-logs .#tidefell)/bin:$PATH"
          export PATH
          scripts/exit-criterion/linux.sh

  windows:
    name: Windows partial replica
    runs-on: windows
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Approve, list, open
        shell: bash
        env:
          TIDEFELL_EXIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIDEFELL_EXIT_RUN: ${{ github.run_id }}
        run: |
          export CARGO_TARGET_DIR=C:/ci/target/tidefell
          cargo build --locked --package tidefell-daemon
          TIDEFELLD="$CARGO_TARGET_DIR/debug/tidefelld.exe" cargo test --locked \
            --package tidefell-tray --test exit_criterion -- --ignored --nocapture
