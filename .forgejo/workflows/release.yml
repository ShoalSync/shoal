name: Release

# A release is a `vX.Y.Z` tag on main whose commit passed CI. Every artifact carries the
# workspace version (ADR 0005). Every job runs on the release runner, which runs nothing else
# (Phase 5c step 5; see docs/project/release-runner.md), with one pinned toolchain. Releases are
# Forgejo releases (ADR 0041): binaries, specs and schemas, each with a SHA-256 file and a cosign
# signature made with the project's release key (cosign.pub). A tag that already exists can be
# released again from the current workflow with a manual run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.4.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # The toolchain every release is built with; bumped deliberately, with the MSRV (ADR 0007).
  # Set for rustup as well as for the install step, so it wins over rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  version:
    name: Check the tag is on main, passed CI and matches the workspace version
    runs-on: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: The tag is on main
        # The checkout fetched every branch (fetch-depth 0), without keeping credentials to
        # fetch again.
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - name: Its commit passed CI
        # Every CI and Nix job's commit status on the tag's commit succeeded.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse "$TAG^{commit}")
          python3 - "$sha" <<'PY'
          import json, os, sys, urllib.request
          sha = sys.argv[1]
          url = f"{os.environ['GITHUB_SERVER_URL']}/api/v1/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/status"
          request = urllib.request.Request(url, headers={"Authorization": f"token {os.environ['TOKEN']}"})
          with urllib.request.urlopen(request) as response:
              statuses = json.load(response)["statuses"]
          # CI and Nix only: this release run posts statuses of its own on the same commit.
          statuses = [s for s in statuses if s["context"].split(" / ")[0] in {"CI", "Nix"}]
          passed = {s["context"].split(" / ")[0] for s in statuses if s["status"] == "success"}
          failed = sorted(s["context"] for s in statuses if s["status"] != "success")
          missing = {"CI", "Nix"} - passed
          if missing or failed:
              print(f"::error::commit {sha} has not passed: missing {sorted(missing)}, not passed {failed}")
              sys.exit(1)
          print(f"passed: {', '.join(sorted(passed))}")
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - id: version
        run: |
          version=$(cargo pkgid --package shoal-cli | sed 's/.*[#@]//')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: version
    runs-on: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            cross: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: matrix.cross
        run: |
          # Installed on the release runner's host: its user has no sudo.
          command -v ${{ matrix.cross }}-gcc
          env=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${env}_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_$(echo "${{ matrix.target }}" | tr - _)=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --package shoal-daemon --package shoal-cli
      - name: Package
        shell: bash
        run: |
          name="shoal-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{shoal,shoald} README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, the newest Forgejo supports
        with:
          retention-days: 1
          name: binaries-${{ matrix.target }}
          path: shoal-*.tar.gz*

  # Windows' programs, built for want of a Windows release runner on the CI runner (ADR 0042's
  # amendment), in a target directory of their own, never the one pull requests' runs keep. They
  # are packaged and signed on the release runner.
  windows:
    name: Binaries (x86_64-pc-windows-msvc)
    needs: version
    runs-on: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/release-target"
          rm -rf "$CARGO_TARGET_DIR"
          cargo build --release --locked --target x86_64-pc-windows-msvc \
            --package shoal-daemon --package shoal-cli --package shoal-tray
          mkdir windows-bin
          cp "$CARGO_TARGET_DIR"/x86_64-pc-windows-msvc/release/{shoal,shoald,shoal-tray}.exe \
            README.md LICENSE-MIT LICENSE-APACHE windows-bin/
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, the newest Forgejo supports
        with:
          retention-days: 1
          name: windows-bin
          path: windows-bin

  windows-packages:
    name: Windows installer and zip
    needs: [version, windows]
    runs-on: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2, the newest Forgejo supports
        with:
          name: windows-bin
          path: windows-bin
      - name: Package
        run: |
          version="${{ needs.version.outputs.version }}"
          name="shoal-$version-x86_64-pc-windows-msvc"
          mkdir out
          cp -r windows-bin "$name"
          python3 -m zipfile -c "out/$name.zip" "$name"
          msitools="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#msitools)"
          PATH="$msitools/bin:$PATH" packaging/windows/msi.sh "$PWD/windows-bin" "$version" \
            "out/shoal-$version-x86_64.msi"
          cd out
          for asset in *; do sha256sum "$asset" > "$asset.sha256"; done
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, the newest Forgejo supports
        with:
          retention-days: 1
          name: windows
          path: out

  specs:
    name: Specs, vectors and schemas
    needs: version
    runs-on: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Package
        run: |
          name="shoal-specs-${{ needs.version.outputs.version }}"
          tar -czf "$name.tar.gz" specs
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          schema="shoald-config-${{ needs.version.outputs.version }}.schema.json"
          cargo run --locked --quiet --package shoal-daemon -- config schema > "$schema"
          sha256sum "$schema" > "$schema.sha256"
          api="shoal-api-${{ needs.version.outputs.version }}.openapi.json"
          cargo run --locked --quiet --package shoal-daemon -- api schema > "$api"
          sha256sum "$api" > "$api.sha256"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, the newest Forgejo supports
        with:
          retention-days: 1
          name: specs
          path: |
            shoal-specs-*.tar.gz*
            shoald-config-*.schema.json*
            shoal-api-*.openapi.json*

  publish:
    name: Publish the release
    needs: [version, binaries, specs, windows-packages]
    runs-on: release
    # Only this job writes: it creates the release and uploads its assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2, the newest Forgejo supports
        with:
          path: dist
      - name: Leave out the unpackaged Windows build
        run: rm -rf dist/windows-bin
      # Each asset gets a .sigstore.json bundle, signed with the release key held in the
      # repository's secrets and checked against cosign.pub, so a key that does not match the
      # published one fails the release. Not recorded in Sigstore's public log: the repository is
      # private, and the log would publish every asset's hash. cosign is the flake's Nixpkgs'.
      - name: Sign the assets
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#cosign)/bin/cosign"
          find dist -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' asset; do
            "$cosign" sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --tlog-upload=false \
              --bundle "$asset.sigstore.json" "$asset"
            "$cosign" verify-blob --key cosign.pub --insecure-ignore-tlog \
              --bundle "$asset.sigstore.json" "$asset"
          done
      - name: Create the release and upload its assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes: the commits since the previous release tag.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          notes=$(git log --format='- %s' ${previous:+"$previous.."}"$TAG")
          python3 - "$notes" <<'PY'
          import json, os, pathlib, sys, urllib.request, uuid
          api = f"{os.environ['GITHUB_SERVER_URL']}/api/v1/repos/{os.environ['GITHUB_REPOSITORY']}"
          auth = {"Authorization": f"token {os.environ['TOKEN']}"}
          tag = os.environ["TAG"]
          body = json.dumps({"tag_name": tag, "name": tag, "body": sys.argv[1], "prerelease": "-" in tag}).encode()
          request = urllib.request.Request(f"{api}/releases", data=body, method="POST",
                                           headers={**auth, "Content-Type": "application/json"})
          with urllib.request.urlopen(request) as response:
              release = json.load(response)["id"]
          for asset in sorted(p for p in pathlib.Path("dist").rglob("*") if p.is_file()):
              boundary = uuid.uuid4().hex
              data = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"attachment\"; "
                      f"filename=\"{asset.name}\"\r\nContent-Type: application/octet-stream\r\n\r\n").encode()
              data += asset.read_bytes() + f"\r\n--{boundary}--\r\n".encode()
              request = urllib.request.Request(f"{api}/releases/{release}/assets?name={asset.name}", data=data,
                                               method="POST", headers={**auth, "Content-Type": f"multipart/form-data; boundary={boundary}"})
              urllib.request.urlopen(request).close()
              print(f"uploaded {asset.name}")
          PY
