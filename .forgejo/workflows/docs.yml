name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", ".forgejo/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  docs:
    name: mdBook
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        # It downloads under $HOME, which the runners on this machine share; a HOME of
        # each job's own keeps jobs running at once from overwriting each other's files.
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: mdbook@0.5.4
      - name: Every ADR is in the book
        run: |
          missing=0
          for adr in docs/adr/[0-9]*.md; do
            name=${adr#docs/}
            [ "$name" = adr/0000-template.md ] && continue
            if ! grep -qF "($name)" docs/SUMMARY.md; then
              echo "::error file=docs/SUMMARY.md::$name is not listed"
              missing=1
            fi
          done
          exit $missing
      - name: Build
        run: mdbook build docs
