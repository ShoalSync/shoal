name: Nix

on:
  # Branch pushes are covered by their pull request.
  push:
    branches: [main]
  # Documentation-only pull requests skip the build; the Docs workflow checks them.
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

# A new push to a pull request cancels its older runs, so the runners build only the latest.
# Each push to main runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Formatting, clippy, the tests, the crate boundaries, the MSRV build, the package and the
    # NixOS module. The compiled dependencies are their own derivation, kept in the runner's Nix
    # store until Cargo.lock changes.
    name: nix flake check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check
        run: nix flake check --print-build-logs
