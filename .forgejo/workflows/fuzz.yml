name: Fuzz

# Every fuzz target for ten minutes each night on main (ADR 0031). Not on pull requests: a few
# runners on one machine serve every repository.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ephemeral
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain and cargo-fuzz
        working-directory: fuzz
        # The nightly pinned in fuzz/rust-toolchain.toml, used for nothing else.
        # Each runner has its own CARGO_HOME, which not every runner's PATH includes; the other
        # workflows get it from dtolnay/rust-toolchain.
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$bin:$PATH"
          echo "$bin" >> "$GITHUB_PATH"
          rustup toolchain install
          if ! cargo fuzz --version 2>/dev/null | grep -q " 0.13.2"; then
            cargo install cargo-fuzz --locked --version 0.13.2 --force
          fi
      - name: Run each target
        working-directory: fuzz
        # The corpus each run grows is kept on the runner slot, beside its CARGO_HOME, which a
        # container runner keeps between jobs; the seeds in fuzz/corpus are read only.
        run: |
          corpus="${CARGO_HOME:-$HOME/.cargo}/tidefell-fuzz/corpus"
          failed=0
          for target in $(cargo fuzz list); do
            mkdir -p "$corpus/$target"
            seeds=()
            if [ -d "corpus/$target" ]; then seeds=("corpus/$target"); fi
            if ! cargo fuzz run "$target" "$corpus/$target" "${seeds[@]}" -- -max_total_time=600; then
              echo "::error::$target found a crash"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, the newest Forgejo supports
        if: failure()
        with:
          retention-days: 7
          name: fuzz-crashes
          path: fuzz/artifacts
