name: CI

on:
  # Branch pushes are covered by their pull request.
  push:
    branches: [main]
  # Documentation-only pull requests skip the build; the Docs workflow checks them.
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

# A new push to a pull request cancels its older runs, so the runners build only the latest.
# Each push to main runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only help repeated local builds; in CI they only take space.
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  # Formatting, clippy, the tests, the crate boundaries and the MSRV build run in the Nix
  # workflow (`nix flake check`), which keeps the compiled dependencies between runs. The FUSE
  # tests need /dev/fuse, which the Nix sandbox does not have, so they run here.
  fuse:
    name: FUSE tests
    runs-on: ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Built by Nix from the compiled dependencies, or fetched from the binary cache when this
      # source was built before (`ci-host` in flake.nix).
      - name: Host build
        run: echo "HOST=$(nix build --no-link --print-out-paths --print-build-logs .#ci-host)" >> "$GITHUB_ENV"
      - name: Test
        # The FUSE mount tests must run, not skip: the runners give jobs /dev/fuse and mount().
        env:
          TIDEFELL_REQUIRE_FUSE: "1"
        run: |
          "$HOST/tests/kernel"
          TIDEFELLD="$HOST/bin/tidefelld" "$HOST/tests/mount"

  # Several engines on a simulated network, through steps 200 seeds choose (ADR 0036). The
  # Nix workflow runs a few; this runs the pull request's share, and the nightly Simulation
  # workflow 10,000 more.
  simulation:
    name: Simulation
    runs-on: ephemeral
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Built by Nix from the compiled dependencies, or fetched from the binary cache when this
      # source was built before (`ci-host` in flake.nix).
      - name: Host build
        run: echo "HOST=$(nix build --no-link --print-out-paths --print-build-logs .#ci-host)" >> "$GITHUB_ENV"
      - name: 200 seeds
        env:
          TIDEFELL_SIM_SEEDS: "200"
          TIDEFELL_SIM_JOBS: "6"
        run: |
          export TIDEFELL_SIM_DIR="$RUNNER_TEMP/simulation"
          export TIDEFELL_SIM_REGRESSIONS="$PWD/crates/sim/tests/regressions"
          mkdir -p "$TIDEFELL_SIM_DIR"
          "$HOST/tests/seeds" --nocapture

  # Dependency and public API checks. Kept in one job, under its original name, because one
  # runner serves every repository.
  deny:
    name: cargo-deny
    runs-on: ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The API check compares with the last release tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      # The action runs in a container; installing the binary avoids needing Docker on the runner.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        # It downloads under $HOME, which the runners on this machine share; a HOME of
        # each job's own keeps jobs running at once from overwriting each other's files.
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: cargo-deny,cargo-machete,cargo-semver-checks
      - name: Check
        run: cargo deny --all-features check
      - name: Unused dependencies
        run: cargo machete
      - name: Public API (proto, sdk)
        # Compatibility starts at 1.0 (ADR 0026): before then, breaking changes since the last
        # release are reported in the job summary and do not fail the job.
        run: |
          baseline=$(git describe --tags --abbrev=0 --match 'v*')
          version=$(cargo pkgid --package tidefell-sdk | sed 's/.*[#@]//')
          status=0
          cargo semver-checks --color never --baseline-rev "$baseline" \
            --package tidefell-proto --package tidefell-sdk > semver.txt 2>&1 || status=$?
          cat semver.txt
          {
            echo "### Public API of proto and sdk since $baseline"
            echo '```'
            tail -n 60 semver.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            case "$version" in
              0.*) echo "::warning::proto or sdk changed incompatibly since $baseline; allowed before 1.0" ;;
              *) exit "$status" ;;
            esac
          fi

  kotlin:
    name: Kotlin bindings (JVM)
    runs-on: ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Built by Nix from the compiled dependencies, or fetched from the binary cache when this
      # source was built before (`ci-host` in flake.nix).
      - name: Host build
        run: echo "HOST=$(nix build --no-link --print-out-paths --print-build-logs .#ci-host)" >> "$GITHUB_ENV"
      # A JDK from the same Nixpkgs as the host build: a library built by Nix loads into a JVM
      # on Nix's C library, not into one on the runner's.
      - name: JDK
        run: |
          jdk=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#jdk21_headless)
          echo "JAVA_HOME=$jdk/lib/openjdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Run the JVM tests against the host build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :jvm-test:test "-Ptidefell.host=$HOST"

  aar:
    name: Android library (AAR)
    runs-on: ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Built by Nix, or fetched from the binary cache when this source was built before:
      # tidefell-ffi for each ABI, the bindings generated from the host build (`ci-host`), and the
      # NDK they were built with, for the loadable check.
      - name: Libraries and bindings
        run: |
          {
            # One ABI at a time: three optimised builds of tidefell-ffi at once outgrow a job's
            # memory when they are not in the cache yet.
            echo "JNI_LIBS=$(nix build --max-jobs 1 --no-link --print-out-paths --print-build-logs .#tidefell-ffi-android)"
            echo "HOST=$(nix build --no-link --print-out-paths --print-build-logs .#ci-host)"
            ndk=$(nix build --no-link --print-out-paths --print-build-logs .#android-ndk)
            echo "ANDROID_NDK_HOME=$(echo "$ndk"/libexec/android-sdk/ndk/*)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # The runners carry no Android SDK; it is kept in each slot's tool cache.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Android platform
        run: |
          # Steps run with pipefail, and yes ends on SIGPIPE once sdkmanager stops reading.
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36"
      - name: Build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :ffi:assembleRelease "-Ptidefell.jniLibs=$JNI_LIBS" "-Ptidefell.host=$HOST"
      - name: Loadable by Android
        run: bindings/android/check-loadable.sh bindings/android/ffi/build/outputs/aar/ffi-release.aar

  # Windows (ADR 0042): clippy holds, and the workspace's tests pass there. Tests that need
  # Linux, such as FUSE, the simulation and those that make files unreadable by mode, are gated
  # out by target.
  windows:
    name: Windows
    runs-on: windows
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Clippy and tests
        shell: bash
        run: |
          # Kept between runs, outside the checkout, where Defender does not scan; the runner is
          # not ephemeral.
          export CARGO_TARGET_DIR=C:/ci/target/tidefell
          mkdir -p "$CARGO_TARGET_DIR" || unset CARGO_TARGET_DIR
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --no-fail-fast

  # The workflows themselves (ADR 0031): actionlint, and zizmor, whose findings of medium
  # severity or higher fail, so actions stay pinned by commit.
  workflows:
    name: Workflows
    runs-on: ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        # It downloads under $HOME, which the runners on this machine share; a HOME of
        # each job's own keeps jobs running at once from overwriting each other's files.
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: zizmor@1.30.1
      - name: actionlint
        # install-action does not carry it: the release binary, checked against its checksum.
        run: |
          version=1.7.12
          name="actionlint_${version}_linux_amd64.tar.gz"
          curl -sfL -o "$RUNNER_TEMP/$name" "https://github.com/rhysd/actionlint/releases/download/v$version/$name"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$name" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yml
      - name: zizmor
        run: zizmor --offline --min-severity medium .forgejo/workflows/*.yml
