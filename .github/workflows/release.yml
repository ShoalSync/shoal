name: Release

# A release is a `vX.Y.Z` tag on main. Every artifact carries the workspace version (ADR 0005).
# Jobs run on the self-hosted runner except the macOS build. A tag that already exists can be
# released again from the current workflow with a manual run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.4.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check tag matches workspace version
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: |
          version=$(cargo pkgid --package tidefell-cli | sed 's/.*[#@]//')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    # The macOS build needs hosted minutes; the release goes out without it when they run out.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: self-hosted
            optional: false
          - target: aarch64-unknown-linux-gnu
            os: self-hosted
            optional: false
            cross: aarch64-linux-gnu
          - target: aarch64-apple-darwin
            os: macos-latest
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: matrix.cross
        run: |
          command -v ${{ matrix.cross }}-gcc || sudo apt-get install -y gcc-${{ matrix.cross }}
          env=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${env}_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_$(echo "${{ matrix.target }}" | tr - _)=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --package tidefell-daemon --package tidefell-cli
      - name: Package
        shell: bash
        run: |
          name="tidefell-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{tidefell,tidefelld} README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum > /dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: tidefell-*.tar.gz*

  specs:
    name: Specs, vectors and schemas
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: |
          name="tidefell-specs-${{ needs.version.outputs.version }}"
          tar -czf "$name.tar.gz" specs
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          schema="tidefelld-config-${{ needs.version.outputs.version }}.schema.json"
          cargo run --locked --quiet --package tidefell-daemon -- config schema > "$schema"
          sha256sum "$schema" > "$schema.sha256"
          api="tidefell-api-${{ needs.version.outputs.version }}.openapi.json"
          cargo run --locked --quiet --package tidefell-daemon -- api schema > "$api"
          sha256sum "$api" > "$api.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: specs
          path: |
            tidefell-specs-*.tar.gz*
            tidefelld-config-*.schema.json*
            tidefell-api-*.openapi.json*

  docs:
    name: Documentation
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build and package
        run: |
          mdbook build docs
          name="tidefell-docs-${{ needs.version.outputs.version }}"
          mv docs/book "$name"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: tidefell-docs-*.tar.gz*

  aar:
    name: Android library (AAR)
    needs: version
    runs-on: self-hosted
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          # The self-hosted runners share one ~/.cargo; restoring or cleaning its bin
          # directory in one job pulls cargo and tools out from under the others.
          cache-bin: "false"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install cargo-ndk and the NDK
        run: |
          # A restored cache can record cargo-ndk as installed without its binary on this
          # runner, so check the binary itself.
          if ! cargo ndk --version 2>/dev/null | grep -q " 4.1.2"; then
            cargo install cargo-ndk --locked --version 4.1.2 --force
          fi
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :ffi:assembleRelease
      - name: Package
        run: |
          name="tidefell-ffi-${{ needs.version.outputs.version }}.aar"
          cp bindings/android/ffi/build/outputs/aar/ffi-release.aar "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: tidefell-ffi-*.aar*

  publish:
    name: Publish GitHub release
    needs: [version, binaries, specs, docs, aar]
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
