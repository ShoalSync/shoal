name: Release

# A release is a `vX.Y.Z` tag on main. Every artifact carries the workspace version (ADR 0005).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tidefell-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --package tidefell-daemon --package tidefell-cli
      - name: Package
        shell: bash
        run: |
          name="tidefell-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{tidefell,tidefelld} README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: tidefell-*.tar.gz*

  specs:
    name: Specs, vectors and schemas
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: |
          name="tidefell-specs-${{ needs.version.outputs.version }}"
          tar -czf "$name.tar.gz" specs
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          schema="tidefelld-config-${{ needs.version.outputs.version }}.schema.json"
          cargo run --locked --quiet --package tidefell-daemon -- config schema > "$schema"
          sha256sum "$schema" > "$schema.sha256"
          api="tidefell-api-${{ needs.version.outputs.version }}.openapi.json"
          cargo run --locked --quiet --package tidefell-daemon -- api schema > "$api"
          sha256sum "$api" > "$api.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: specs
          path: |
            tidefell-specs-*.tar.gz*
            tidefelld-config-*.schema.json*
            tidefell-api-*.openapi.json*

  publish:
    name: Publish GitHub release
    needs: [version, binaries, specs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
