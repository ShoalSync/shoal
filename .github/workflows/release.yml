name: Release

# A release is a `vX.Y.Z` tag on main whose commit passed CI. Every artifact carries the
# workspace version (ADR 0005). Every job runs on a fresh GitHub-hosted runner with one pinned
# toolchain and no cache (ADR 0045). Releases are GitHub releases: binaries, the Windows
# installer, specs and schemas, and the third-party licences, each with a SHA-256 file and a
# cosign signature made without a key, through Sigstore, by this workflow's identity. A tag that
# already exists can be released again from the current workflow with a manual run on main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.4.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # The toolchain every release is built with; bumped deliberately, with the MSRV (ADR 0007).
  # Set for rustup as well as for the install step, so it wins over rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  version:
    name: Check the tag is on main, passed CI and matches the workspace version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: The tag is on main
        # The checkout fetched every branch (fetch-depth 0), without keeping credentials to
        # fetch again.
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - name: Its commit passed CI
        # The latest run of each of the CI and Docs workflows for the push of the tag's commit
        # to main succeeded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$TAG^{commit}")
          failed=0
          for workflow in CI Docs; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$workflow\")] | sort_by(.created_at) | last | .conclusion // \"missing\"")
            echo "$workflow: $conclusion"
            if [ "$conclusion" != success ]; then
              echo "::error::commit $sha has not passed $workflow ($conclusion)"
              failed=1
            fi
          done
          exit "$failed"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - id: version
        run: |
          version=$(cargo pkgid --package shoal-cli | sed 's/.*[#@]//')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --package shoal-daemon --package shoal-cli
      - name: Package
        shell: bash
        run: |
          name="shoal-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{shoal,shoald} README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: binaries-${{ matrix.target }}
          path: shoal-*.tar.gz*

  windows:
    name: Binaries (x86_64-pc-windows-msvc)
    needs: version
    runs-on: windows-2025
    steps:
      - name: Long paths for git
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc \
            --package shoal-daemon --package shoal-cli --package shoal-tray
          mkdir windows-bin
          cp target/x86_64-pc-windows-msvc/release/{shoal,shoald,shoal-tray}.exe \
            README.md LICENSE-MIT LICENSE-APACHE windows-bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: windows-bin
          path: windows-bin

  windows-packages:
    name: Windows installer and zip
    needs: [version, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-bin
          path: windows-bin
      - name: Package
        run: |
          version="${{ needs.version.outputs.version }}"
          name="shoal-$version-x86_64-pc-windows-msvc"
          mkdir out
          cp -r windows-bin "$name"
          python3 -m zipfile -c "out/$name.zip" "$name"
          msitools="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#msitools)"
          PATH="$msitools/bin:$PATH" packaging/windows/msi.sh "$PWD/windows-bin" "$version" \
            "out/shoal-$version-x86_64.msi"
          cd out
          for asset in *; do sha256sum "$asset" > "$asset.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: windows
          path: out

  specs:
    name: Specs, schemas and licences
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about
      - name: Package
        run: |
          name="shoal-specs-${{ needs.version.outputs.version }}"
          tar -czf "$name.tar.gz" specs
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          schema="shoald-config-${{ needs.version.outputs.version }}.schema.json"
          cargo run --locked --quiet --package shoal-daemon -- config schema > "$schema"
          sha256sum "$schema" > "$schema.sha256"
          api="shoal-api-${{ needs.version.outputs.version }}.openapi.json"
          cargo run --locked --quiet --package shoal-daemon -- api schema > "$api"
          sha256sum "$api" > "$api.sha256"
          # Every dependency's licence and notice (about.toml).
          cargo about generate --locked --fail about.hbs > THIRD-PARTY-LICENSES.html
          sha256sum THIRD-PARTY-LICENSES.html > THIRD-PARTY-LICENSES.html.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: specs
          path: |
            shoal-specs-*.tar.gz*
            shoald-config-*.schema.json*
            shoal-api-*.openapi.json*
            THIRD-PARTY-LICENSES.html*

  publish:
    name: Publish the release
    needs: [version, binaries, specs, windows-packages]
    runs-on: ubuntu-24.04
    # The protected environment: only tags and main may deploy to it.
    environment: release
    # Only this job writes: it creates the release, uploads its assets, and signs them with
    # this run's identity.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Leave out the unpackaged Windows build
        run: rm -rf dist/windows-bin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Each asset gets a .sigstore.json bundle: a short-lived Sigstore certificate for this
      # workflow's identity (GitHub's OIDC token), recorded in Sigstore's public log. Checked at
      # once against the identity users check (docs/guide/install.md), so a mismatch fails here.
      - name: Sign the assets
        run: |
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          find dist -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' asset; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
      - name: Create the release and upload its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The notes: the release's own, docs/releases/<version>.md, if it has them, then the
          # commits since the previous release, leaving out release candidates.
          notes="docs/releases/${TAG#v}.md"
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "$TAG^" 2>/dev/null || true)
          {
            if [ -f "$notes" ]; then
              cat "$notes"
              printf '\n## Changes since %s\n\n' "${previous:-the start}"
            fi
            git log --format='- %s' ${previous:+"$previous.."}"$TAG"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          find dist -type f -print0 | xargs -0 gh release create "$TAG" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
