name: Release

# A release is a `vX.Y.Z` tag on main whose commit passed CI. Every artifact carries the
# workspace version (ADR 0005). Every job runs on the release runner, which runs nothing else
# (Phase 5c step 5; see docs/project/release-runner.md), with one pinned toolchain; there are no
# macOS binaries until there is a self-hosted Mac, since hosted macOS minutes cost money. Each
# asset is signed with Sigstore, keyless, by this workflow's identity. A tag that already exists
# can be released again from the current workflow with a manual run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.4.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # The toolchain every release is built with; bumped deliberately, with the MSRV (ADR 0007).
  # Set for rustup as well as for the install step, so it wins over rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  version:
    name: Check the tag is on main, passed CI and matches the workspace version
    runs-on: release
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: The tag is on main
        # The checkout fetched every branch (fetch-depth 0), without keeping credentials to
        # fetch again.
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - name: Its commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$TAG^{commit}")
          python3 - "$sha" <<'PY'
          import json, os, sys, urllib.request
          sha = sys.argv[1]
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={sha}&status=success&per_page=100"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request) as response:
              passed = {run["name"] for run in json.load(response)["workflow_runs"]}
          missing = {"CI", "Nix"} - passed
          if missing:
              print(f"::error::commit {sha} has no successful run of {', '.join(sorted(missing))}")
              sys.exit(1)
          print(f"passed: {', '.join(sorted(passed))}")
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - id: version
        run: |
          version=$(cargo pkgid --package tidefell-cli | sed 's/.*[#@]//')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: version
    runs-on: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            cross: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: matrix.cross
        run: |
          command -v ${{ matrix.cross }}-gcc || sudo apt-get install -y gcc-${{ matrix.cross }}
          env=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${env}_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_$(echo "${{ matrix.target }}" | tr - _)=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --package tidefell-daemon --package tidefell-cli
      - name: Package
        shell: bash
        run: |
          name="tidefell-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{tidefell,tidefelld} README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 1
          name: binaries-${{ matrix.target }}
          path: tidefell-*.tar.gz*

  specs:
    name: Specs, vectors and schemas
    needs: version
    runs-on: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Package
        run: |
          name="tidefell-specs-${{ needs.version.outputs.version }}"
          tar -czf "$name.tar.gz" specs
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          schema="tidefelld-config-${{ needs.version.outputs.version }}.schema.json"
          cargo run --locked --quiet --package tidefell-daemon -- config schema > "$schema"
          sha256sum "$schema" > "$schema.sha256"
          api="tidefell-api-${{ needs.version.outputs.version }}.openapi.json"
          cargo run --locked --quiet --package tidefell-daemon -- api schema > "$api"
          sha256sum "$api" > "$api.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 1
          name: specs
          path: |
            tidefell-specs-*.tar.gz*
            tidefelld-config-*.schema.json*
            tidefell-api-*.openapi.json*

  docs:
    name: Documentation
    needs: version
    runs-on: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: mdbook@0.5.4
      - name: Build and package
        run: |
          mdbook build docs
          name="tidefell-docs-${{ needs.version.outputs.version }}"
          mv docs/book "$name"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 1
          name: docs
          path: tidefell-docs-*.tar.gz*

  aar:
    name: Android library (AAR)
    needs: version
    runs-on: release
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install cargo-ndk and the NDK
        run: |
          # The runners share ~/.cargo, and its install records can outlive the binary, so
          # check the binary itself.
          if ! cargo ndk --version 2>/dev/null | grep -q " 4.1.2"; then
            cargo install cargo-ndk --locked --version 4.1.2 --force
          fi
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :ffi:assembleRelease
      - name: Loadable by Android
        run: bindings/android/check-loadable.sh bindings/android/ffi/build/outputs/aar/ffi-release.aar
      - name: Package
        run: |
          name="tidefell-ffi-${{ needs.version.outputs.version }}.aar"
          cp bindings/android/ffi/build/outputs/aar/ffi-release.aar "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 1
          name: aar
          path: tidefell-ffi-*.aar*

  publish:
    name: Publish GitHub release
    needs: [version, binaries, specs, docs, aar]
    runs-on: release
    # Only this job writes: it creates the release and uploads its assets. The ID token lets
    # Sigstore issue it a certificate for this workflow on this tag.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every asset
        # Keyless: a short-lived certificate names this repository, workflow and tag, and the
        # signature is in Sigstore's public log. Each asset gets a `.sigstore.json` bundle to
        # verify it with (docs/guide/install.md). Checksum files are not signed; the asset is.
        run: |
          for asset in dist/*; do
            case "$asset" in *.sha256) continue ;; esac
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done
          ls dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
