name: CI

# On GitHub's hosted runners (ADR 0045). Every pull request runs every job, documentation-only
# ones too: the jobs are required checks, and a workflow skipped by a path filter never reports.
on:
  # Branch pushes are covered by their pull request.
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older runs, so only the latest is built. Each push to
# main runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only help repeated local builds; in CI they only take space.
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  # Formatting, clippy, the tests, the crate boundaries, the MSRV build, the package, the NixOS
  # module and the test installer (`nix flake check`), and the builds the jobs below run: the
  # host build (`ci-host`) and shoal-ffi for each Android ABI, handed to them as an artifact.
  # The compiled dependencies are their own derivations, kept in the Nix store this job saves
  # on main and restores, until the lock files change.
  build:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      host: ${{ steps.outputs.outputs.host }}
      jni-libs: ${{ steps.outputs.outputs.jni-libs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Builds the other jobs use
        id: outputs
        run: |
          host=$(nix build --no-link --print-out-paths --print-build-logs .#ci-host)
          # One ABI at a time: three optimised builds of shoal-ffi at once outgrow a job's
          # memory when they are not in the store yet.
          jni=$(nix build --max-jobs 1 --no-link --print-out-paths --print-build-logs .#shoal-ffi-android)
          # With everything they need at run time, as a binary cache the jobs after this one
          # copy from (.github/actions/build-outputs).
          out="$RUNNER_TEMP/build-outputs"
          nix copy --to "file://$out?compression=zstd" "$host" "$jni"
          printf 'host=%s\njni-libs=%s\n' "$host" "$jni" >> "$GITHUB_OUTPUT"
          du -sh "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: build-outputs
          path: ${{ runner.temp }}/build-outputs
          # Compressed already.
          compression-level: 0
      - name: Check
        run: nix flake check --print-build-logs
      # For the Windows jobs to install and uninstall: built on Linux with wixl from placeholder
      # programs (ADR 0042).
      - name: The test installer
        run: cp "$(nix build --no-link --print-out-paths .#windows-installer-test)/shoal-test.msi" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: windows-installer
          path: shoal-test.msi

  # The FUSE tests need /dev/fuse, which the Nix sandbox does not have, so they run here.
  fuse:
    name: FUSE tests
    needs: build
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ needs.build.outputs.host }}
      JNI_LIBS: ${{ needs.build.outputs.jni-libs }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-outputs
      # fusermount3, which mounts for a user that is not root.
      - name: FUSE
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fuse3
      - name: Test
        # The FUSE mount tests must run, not skip.
        env:
          SHOAL_REQUIRE_FUSE: "1"
        run: |
          "$HOST/tests/kernel"
          SHOALD="$HOST/bin/shoald" "$HOST/tests/mount"

  # Several engines on a simulated network, through steps 200 seeds choose (ADR 0036). The
  # Nix check runs a few; this runs the pull request's share, and the nightly Simulation
  # workflow 10,000 more.
  simulation:
    name: Simulation
    needs: build
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ needs.build.outputs.host }}
      JNI_LIBS: ${{ needs.build.outputs.jni-libs }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-outputs
      - name: 200 seeds
        env:
          SHOAL_SIM_SEEDS: "200"
          SHOAL_SIM_JOBS: "4"
        run: |
          export SHOAL_SIM_DIR="$RUNNER_TEMP/simulation"
          export SHOAL_SIM_REGRESSIONS="$PWD/crates/sim/tests/regressions"
          mkdir -p "$SHOAL_SIM_DIR"
          "$HOST/tests/seeds" --nocapture

  # Dependency, licence and public API checks.
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The API check compares with the last release tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,cargo-machete,cargo-semver-checks,cargo-about
      - name: Check
        run: cargo deny --all-features check
      - name: Unused dependencies
        run: cargo machete
      # The notices each release carries as THIRD-PARTY-LICENSES.html: every dependency's
      # licence must be one about.toml accepts.
      - name: Third-party licences
        run: cargo about generate --locked --fail about.hbs > /dev/null
      - name: Public API (proto, sdk)
        # Compatibility starts at 1.0 (ADR 0026): before then, breaking changes since the last
        # release are reported in the job summary and do not fail the job.
        run: |
          baseline=$(git describe --tags --abbrev=0 --match 'v*')
          version=$(cargo pkgid --package shoal-sdk | sed 's/.*[#@]//')
          status=0
          cargo semver-checks --color never --baseline-rev "$baseline" \
            --package shoal-proto --package shoal-sdk > semver.txt 2>&1 || status=$?
          cat semver.txt
          {
            echo "### Public API of proto and sdk since $baseline"
            echo '```'
            tail -n 60 semver.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            case "$version" in
              0.*) echo "::warning::proto or sdk changed incompatibly since $baseline; allowed before 1.0" ;;
              *) exit "$status" ;;
            esac
          fi

  kotlin:
    name: Kotlin bindings (JVM)
    needs: build
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ needs.build.outputs.host }}
      JNI_LIBS: ${{ needs.build.outputs.jni-libs }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-outputs
      # A JDK from the same Nixpkgs as the host build: a library built by Nix loads into a JVM
      # on Nix's C library, not into one on the runner's.
      - name: JDK
        run: |
          jdk=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#jdk21_headless)
          echo "JAVA_HOME=$jdk/lib/openjdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Run the JVM tests against the host build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :jvm-test:test "-Pshoal.host=$HOST"

  aar:
    name: Android library (AAR)
    needs: build
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ needs.build.outputs.host }}
      JNI_LIBS: ${{ needs.build.outputs.jni-libs }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # shoal-ffi for each ABI, and the bindings generated from the host build (`ci-host`).
      - uses: ./.github/actions/build-outputs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # The image's Android SDK, with the platform the library builds against, and its newest
      # NDK, whose llvm-readelf the loadable check uses.
      - name: Android platform
        run: |
          # The image does not put sdkmanager on PATH. Steps run with pipefail, and yes ends on
          # SIGPIPE once sdkmanager stops reading.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :ffi:assembleRelease "-Pshoal.jniLibs=$JNI_LIBS" "-Pshoal.host=$HOST"
      - name: Loadable by Android
        run: bindings/android/check-loadable.sh bindings/android/ffi/build/outputs/aar/ffi-release.aar

  # Windows (ADR 0042): the test installer installs and uninstalls, clippy holds, the cfapi
  # primitives and the tray's Storage window work in the runner's desktop session, and the
  # workspace's tests pass. Tests that need Linux, such as FUSE, the simulation and those that
  # make files unreadable by mode, are gated out by target. Windows Server 2025 on x86-64, and
  # Windows 11 on ARM64.
  windows:
    name: Windows (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Long paths for git
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy
      # The compiled dependencies, saved from main only, so pull requests cannot change what
      # main's runs restore. The exit criterion's Windows half restores the same.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Clear sync roots earlier runs left
        shell: powershell
        run: ./scripts/windows-clear-test-sync-roots.ps1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: installer
      - name: The installer installs and uninstalls
        shell: bash
        timeout-minutes: 20
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File packaging/windows/test-install.ps1 installer/shoal-test.msi
      - name: Clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: cfapi primitives
        shell: bash
        run: cargo test --locked -p shoal-fs-cfapi --test primitives -- --ignored --nocapture --test-threads=1
      # The tray's Storage window, drawn in the runner's desktop session: its picture is in the
      # log, as base64 PNG on `SHOT storage` lines.
      - name: The tray's Storage window
        shell: bash
        run: |
          cargo build --locked -p shoal-daemon
          SHOAL_SCREENSHOT=1 cargo test --locked -p shoal-tray --test storage -- --nocapture
      - name: Tests
        shell: bash
        run: cargo test --locked --workspace --no-fail-fast
      - name: Clear the sync roots this run left
        if: always()
        shell: powershell
        run: ./scripts/windows-clear-test-sync-roots.ps1

  # The workflows themselves (ADR 0031): actionlint, and zizmor, whose findings of medium
  # severity or higher fail, so actions stay pinned by commit; and the old name's check.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
      - name: actionlint
        # install-action does not carry it: the release binary, checked against its checksum.
        run: |
          version=1.7.12
          name="actionlint_${version}_linux_amd64.tar.gz"
          curl -sfL -o "$RUNNER_TEMP/$name" "https://github.com/rhysd/actionlint/releases/download/v$version/$name"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$name" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: zizmor
        run: zizmor --offline --min-severity medium .github
      # The old name stays out of the tree (ADR 0043).
      - name: The old name stays out
        run: scripts/check-old-name.sh
