name: CI

on:
  # Branch pushes are covered by their pull request; one runner serves every repo.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        # The FUSE mount tests must run, not skip, on the self-hosted runner.
        env:
          TIDEFELL_REQUIRE_FUSE: "1"
        run: cargo test --workspace --locked
      - name: Crate boundaries
        run: cargo xtask check-deps

  msrv:
    name: MSRV (1.91)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - name: Build
        run: cargo +1.91 build --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The action runs in a container; installing the binary avoids needing Docker on the runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check
        run: cargo deny --all-features check

  docs:
    name: mdBook
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Every ADR is in the book
        run: |
          missing=0
          for adr in docs/adr/[0-9]*.md; do
            name=${adr#docs/}
            [ "$name" = adr/0000-template.md ] && continue
            if ! grep -qF "($name)" docs/SUMMARY.md; then
              echo "::error file=docs/SUMMARY.md::$name is not listed"
              missing=1
            fi
          done
          exit $missing
      - name: Build
        run: mdbook build docs

  kotlin:
    name: Kotlin bindings (JVM)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the bindings and run the JVM tests
        working-directory: bindings/android
        run: ./gradlew --no-daemon :jvm-test:test

  aar:
    name: Android library (AAR)
    runs-on: self-hosted
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The self-hosted runner may not carry an Android SDK the way GitHub's images do.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Install cargo-ndk and the NDK
        run: |
          # The runners share ~/.cargo, and its install records can outlive the binary, so
          # check the binary itself.
          if ! cargo ndk --version 2>/dev/null | grep -q " 4.1.2"; then
            cargo install cargo-ndk --locked --version 4.1.2 --force
          fi
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :ffi:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tidefell-ffi-aar
          path: bindings/android/ffi/build/outputs/aar/ffi-release.aar
