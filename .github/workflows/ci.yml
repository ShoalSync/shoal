name: CI

on:
  # Branch pushes are covered by their pull request; three runners serve every repo.
  push:
    branches: [main]
  # Documentation-only pull requests skip the build; the Docs workflow checks them.
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

# A new push to a pull request cancels its older runs, so the runners build only the latest.
# Each push to main runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only help repeated local builds; in CI they only take space.
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting, clippy, the tests, the crate boundaries and the MSRV build run in the Nix
  # workflow (`nix flake check`), which keeps the compiled dependencies between runs. The FUSE
  # tests need /dev/fuse, which the Nix sandbox does not have, so they run here.
  fuse:
    name: FUSE tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cargo-target
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        # The FUSE mount tests must run, not skip, on the self-hosted runner.
        env:
          TIDEFELL_REQUIRE_FUSE: "1"
        run: |
          cargo test --locked --package tidefell-fs-fuse --test kernel
          cargo test --locked --package tidefell-daemon --test mount

  # Dependency and public API checks. Kept in one job, under its original name, because one
  # runner serves every repository.
  deny:
    name: cargo-deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # The API check compares with the last release tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The action runs in a container; installing the binary avoids needing Docker on the runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-semver-checks
      - name: Check
        run: cargo deny --all-features check
      - name: Unused dependencies
        run: cargo machete
      - name: Public API (proto, sdk)
        # Compatibility starts at 1.0 (ADR 0026): before then, breaking changes since the last
        # release are reported in the job summary and do not fail the job.
        run: |
          baseline=$(git describe --tags --abbrev=0 --match 'v*')
          version=$(cargo pkgid --package tidefell-sdk | sed 's/.*[#@]//')
          status=0
          cargo semver-checks --color never --baseline-rev "$baseline" \
            --package tidefell-proto --package tidefell-sdk > semver.txt 2>&1 || status=$?
          cat semver.txt
          {
            echo "### Public API of proto and sdk since $baseline"
            echo '```'
            tail -n 60 semver.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            case "$version" in
              0.*) echo "::warning::proto or sdk changed incompatibly since $baseline; allowed before 1.0" ;;
              *) exit "$status" ;;
            esac
          fi

  kotlin:
    name: Kotlin bindings (JVM)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cargo-target
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the bindings and run the JVM tests
        working-directory: bindings/android
        run: ./gradlew --no-daemon :jvm-test:test

  aar:
    name: Android library (AAR)
    runs-on: self-hosted
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cargo-target
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The self-hosted runner may not carry an Android SDK the way GitHub's images do.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which the SDK repository no longer carries.
          packages: platform-tools
      - name: Install cargo-ndk and the NDK
        run: |
          # The runners share ~/.cargo, and its install records can outlive the binary, so
          # check the binary itself.
          if ! cargo ndk --version 2>/dev/null | grep -q " 4.1.2"; then
            cargo install cargo-ndk --locked --version 4.1.2 --force
          fi
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        working-directory: bindings/android
        run: ./gradlew --no-daemon :ffi:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tidefell-ffi-aar
          path: bindings/android/ffi/build/outputs/aar/ffi-release.aar
