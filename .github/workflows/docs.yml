name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  docs:
    name: mdBook
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: mdbook@0.5.4
      - name: Every ADR is in the book
        run: |
          missing=0
          for adr in docs/adr/[0-9]*.md; do
            name=${adr#docs/}
            [ "$name" = adr/0000-template.md ] && continue
            if ! grep -qF "($name)" docs/SUMMARY.md; then
              echo "::error file=docs/SUMMARY.md::$name is not listed"
              missing=1
            fi
          done
          exit $missing
      - name: Build
        run: mdbook build docs
