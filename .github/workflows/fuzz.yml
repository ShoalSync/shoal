name: Fuzz

# Every fuzz target for ten minutes each night on main (ADR 0031).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain and cargo-fuzz
        working-directory: fuzz
        # The nightly pinned in fuzz/rust-toolchain.toml, used for nothing else.
        run: |
          rustup toolchain install
          cargo install cargo-fuzz --locked --version 0.13.2
      # The corpus each night grows, kept from one night to the next; the seeds in fuzz/corpus
      # are read only.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run each target
        working-directory: fuzz
        run: |
          corpus="$RUNNER_TEMP/corpus"
          failed=0
          for target in $(cargo fuzz list); do
            mkdir -p "$corpus/$target"
            seeds=()
            if [ -d "corpus/$target" ]; then seeds=("corpus/$target"); fi
            if ! cargo fuzz run "$target" "$corpus/$target" "${seeds[@]}" -- -max_total_time=600; then
              echo "::error::$target found a crash"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          retention-days: 7
          name: fuzz-crashes
          path: fuzz/artifacts
