name: Nix

on:
  # Branch pushes are covered by their pull request; three runners serve every repo.
  push:
    branches: [main]
  # Documentation-only pull requests skip the build; the Docs workflow checks them.
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

# A new push to a pull request cancels its older runs, so the runners build only the latest.
# Each push to main runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Build
        run: nix build .#tidefell --print-build-logs
