name: Nix

on:
  # Branch pushes are covered by their pull request; one runner serves every repo.
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: nix build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Build
        run: nix build .#tidefell --print-build-logs
