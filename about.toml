# cargo-about: the third-party notices each release carries as THIRD-PARTY-LICENSES.html
# (`cargo about generate about.hbs`). The licences accepted are deny.toml's, which cargo-deny
# enforces; MPL-2.0 is there for its narrow exceptions only.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what ships: not the dev-dependencies, and not xtask.
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
# The release targets, so crates only one platform uses are listed too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
