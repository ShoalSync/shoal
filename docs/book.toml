[book]
title = "Shoal documentation"
description = "Open-source peer-to-peer file sync"
authors = ["The Shoal contributors"]
language = "en"
src = "."

[build]
build-dir = "book"
# A page listed in SUMMARY.md but missing is an error, not a silently created stub.
create-missing = false

[output.html]
git-repository-url = "https://github.com/ShoalSync/shoal"
edit-url-template = "https://github.com/ShoalSync/shoal/edit/main/docs/{path}"
