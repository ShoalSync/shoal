[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Workspace crates
tidefell-proto = { path = "crates/proto" }
tidefell-chunker = { path = "crates/chunker" }
tidefell-store = { path = "crates/store" }
tidefell-meta = { path = "crates/meta" }
tidefell-identity = { path = "crates/identity" }

# Third-party
blake3 = "1.8"
ed25519-dalek = "3"
fastcdc = "5"
getrandom = "0.4"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
