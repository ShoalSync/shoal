[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Workspace crates
tidefell-proto = { path = "crates/proto" }
tidefell-chunker = { path = "crates/chunker" }
tidefell-store = { path = "crates/store" }
tidefell-meta = { path = "crates/meta" }
tidefell-identity = { path = "crates/identity" }
tidefell-net = { path = "crates/net" }
tidefell-fetch = { path = "crates/fetch" }
tidefell-engine = { path = "crates/engine" }

# Third-party
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
fastcdc = "5"
getrandom = "0.4"
iroh = "1.2"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
