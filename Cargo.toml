[workspace]
members = ["crates/*", "xtask"]
# The fuzz targets build with a nightly toolchain and have their own workspace (ADR 0031).
exclude = ["fuzz", "bench", "third_party/cloud-filter", "third_party/notify"]
resolver = "2"

[workspace.package]
version = "0.23.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` builds with `--cfg fuzzing` (ADR 0031).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Workspace crates
tidefell-proto = { path = "crates/proto" }
tidefell-chunker = { path = "crates/chunker" }
tidefell-store = { path = "crates/store" }
tidefell-meta = { path = "crates/meta" }
tidefell-identity = { path = "crates/identity" }
tidefell-crypto = { path = "crates/crypto" }
tidefell-net = { path = "crates/net" }
tidefell-fetch = { path = "crates/fetch" }
tidefell-engine = { path = "crates/engine" }
tidefell-sdk = { path = "crates/sdk" }
tidefell-api = { path = "crates/api" }
tidefell-web = { path = "crates/web" }
tidefell-fs-fuse = { path = "crates/fs-fuse" }
tidefell-fs-cfapi = { path = "crates/fs-cfapi" }

# Third-party
blake3 = "1.8"
argon2 = "0.6"
askama = "0.16"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
# Encrypted folders (ADR 0023): X25519 for key grants, XChaCha20-Poly1305 and ChaCha20-Poly1305,
# and HKDF-SHA256 for HPKE.
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
fastcdc = "5"
fs4 = "1.1"
fuser = "0.18"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4"
iroh = "1.2"
iroh-mdns-address-lookup = "0.6"
iroh-metrics = "1.0"
# The interfaces' networks, to tell an on-link address such as a home's global IPv6 prefix; the
# version iroh uses.
netwatch = "0.19"
ipnet = "2"
libc = "0.2"
notify = "8.2"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
redb = "3"
proptest = "1"
rustix = { version = "1", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12"
aho-corasick = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
mimalloc = { version = "0.1.52", default-features = false }
thiserror = "2"
unicode-normalization = "0.1"
toml = "1"
utoipa = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
tracing = "0.1"
uniffi = "0.32"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
paranoid-android = "0.2"
# Windows only (ADR 0042): free space, and volume serial numbers and file IDs, without unsafe
# code here; and the Cloud Files API, safely wrapped.
winapi-util = "0.1"
# The tray app's icon, menu and windows (ADR 0042's amendment).
native-windows-gui = { version = "1.0.13", default-features = false, features = ["tray-notification", "message-window", "menu", "notice", "cursor", "tree-view", "combobox", "listbox"] }
cloud-filter = "0.0.6"
nt-time = "0.8"

# Dependencies, above all the Ed25519 and BLAKE3 code, are built optimised in development so
# tests that sign and verify tens of thousands of versions run in seconds. Workspace crates
# stay unoptimised for fast rebuilds and full debug information.
[profile.dev.package."*"]
opt-level = 2

# The Android library (ADR 0014): optimised like release, without debug symbols, which would
# more than double the AAR.
[profile.mobile]
inherits = "release"
strip = "symbols"

# cloud-filter with fixes not yet released upstream (third_party/cloud-filter/PATCHES.md), and
# notify 8 with notify 9's handling of a Windows watch's overflow (third_party/notify/PATCHES.md).
[patch.crates-io]
cloud-filter = { path = "third_party/cloud-filter" }
notify = { path = "third_party/notify" }
