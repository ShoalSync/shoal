[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Workspace crates
tidefell-proto = { path = "crates/proto" }
tidefell-chunker = { path = "crates/chunker" }
tidefell-store = { path = "crates/store" }
tidefell-meta = { path = "crates/meta" }
tidefell-identity = { path = "crates/identity" }
tidefell-net = { path = "crates/net" }
tidefell-fetch = { path = "crates/fetch" }
tidefell-engine = { path = "crates/engine" }
tidefell-sdk = { path = "crates/sdk" }
tidefell-api = { path = "crates/api" }
tidefell-web = { path = "crates/web" }

# Third-party
blake3 = "1.8"
argon2 = "0.6"
askama = "0.16"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
fastcdc = "5"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = "1.2"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
utoipa = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
tracing = "0.1"
uniffi = "0.32"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The Android library (ADR 0014): optimised like release, without debug symbols, which would
# more than double the AAR.
[profile.mobile]
inherits = "release"
strip = "symbols"
