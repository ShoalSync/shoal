# cloud-filter from github.com/ho-229/cloud-filter-rs: main at commit fb36bf4, the version after
# 0.0.6 with Shoal's fixes merged, plus the one addition upstream does not have yet (PATCHES.md).
# Its tests, examples, dev-dependencies and Cargo.lock are left out.
[package]
name = "cloud-filter"
version = "0.0.6"
authors = [
  "ok-nick <nick.libraries@gmail.com>",
  "ho-229 <ho229v3666@gmail.com>",
]
edition = "2021"
description = "A safe and idiomatic wrapper around the Windows Cloud Filter API"
license = "MIT"
repository = "https://github.com/ho-229/cloud-filter-rs"
documentation = "https://docs.rs/cloud-filter"
exclude = ["examples/", ".github/", "test/"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[dependencies]
flagset = "0.4.5"
widestring = "1.0.2"
nt-time = "0.8.0"
memoffset = "0.9.1"
windows = { version = "0.58.0", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_System_CorrelationVector",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Storage_Provider",
  "Win32_System_Memory",
  "Storage",
  "Storage_Search",
  "Foundation",
  "Foundation_Collections",
  "Win32_Security_Authorization",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Search",
  "Storage_Streams",
  "Win32_System_Ioctl",
  "Win32_Security",
  "implement",
] }
globset = { version = "0.4.9", optional = true }

[features]
# Enable globs in the `info::FetchPlaceholders` struct.
globs = ["globset"]
