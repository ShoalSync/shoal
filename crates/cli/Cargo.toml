[package]
name = "tidefell-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tidefell: binary `tidefell`"
publish = false

[[bin]]
name = "tidefell"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
tidefell-sdk.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
serde_json.workspace = true
zip.workspace = true
tempfile.workspace = true
tidefell-api.workspace = true
tidefell-engine.workspace = true
tidefell-identity.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
