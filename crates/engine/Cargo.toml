[package]
name = "shoal-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shoal: replica policies; wires chunker, store, meta, identity, net and fetch into the daemon core"
publish = false

[lints]
workspace = true

# Dependency boundary: must not depend on `shoal-fs-fuse` or `shoal-web`.
# Platform front-ends depend on the engine, never the other way round.
[features]
# Engines on an in-memory network, for the simulation harness (ADR 0036).
simulation = ["shoal-net/simulation"]
# The allocator for a library loaded at run time, such as the Android app's: its thread-local
# storage must not be the static kind, which Android refuses to load from such a library.
dynamic-library = ["mimalloc/local_dynamic_tls"]

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hashbrown.workspace = true
ignore.workspace = true
mimalloc.workspace = true
notify.workspace = true
postcard.workspace = true
redb.workspace = true
serde.workspace = true
thiserror.workspace = true
shoal-chunker.workspace = true
shoal-fetch.workspace = true
shoal-crypto.workspace = true
shoal-identity.workspace = true
shoal-meta.workspace = true
shoal-net.workspace = true
shoal-proto.workspace = true
unicode-normalization.workspace = true
shoal-store.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
regex.workspace = true
aho-corasick.workspace = true
serde_json.workspace = true
zip.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
fs4.workspace = true
winapi-util.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
