[package]
name = "tidefell-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tidefell: replica policies; wires chunker, store, meta, identity, net and fetch into the daemon core"
publish = false

[lints]
workspace = true

# Dependency boundary: must not depend on `tidefell-fs-fuse` or `tidefell-web`.
# Platform front-ends depend on the engine, never the other way round.
[dependencies]
getrandom.workspace = true
ignore.workspace = true
notify.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tidefell-chunker.workspace = true
tidefell-fetch.workspace = true
tidefell-identity.workspace = true
tidefell-meta.workspace = true
tidefell-net.workspace = true
tidefell-proto.workspace = true
tidefell-store.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
