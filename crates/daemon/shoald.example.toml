# Example shoald configuration. Validate with `shoald config check <file>`;
# the JSON Schema is printed by `shoald config schema`.

data_dir = "/var/lib/shoal"
# Watch folders for changes, with a full scan hourly. Folders that cannot be watched are scanned
# every `scan_interval_secs`.
watch = true
# Where crash reports are filed: an issue tracker's issues page. Reports link to a new issue there,
# pre-filled; without it they are shown to copy.
# report_url = "https://github.com/ShoalSync/shoal/issues"

# [limits]
# upload_kib_per_sec = 2048      # unlimited if unset; at least 64
# download_kib_per_sec = 8192
# limit_local = false            # traffic to devices on the local network is not limited

# Prometheus metrics at http://<listen>/metrics, off unless set. No authentication: keep it on
# loopback or a network only the scraper can reach.
# [metrics]
# listen = "127.0.0.1:9477"

[log]
# "info", "debug", or per module such as "info,shoal_net=debug". RUST_LOG overrides it.
level = "info"
# JSON lines in <data_dir>/logs/. By default written unless the system journal keeps the logs.
# file = true

[network]
# "default" uses the public iroh relays; "custom" uses `urls`; "disabled" allows only direct
# connections.
relay = { mode = "default" }
address_lookup = true
bind = "0.0.0.0:7777"

[[network.peers]]
device = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
addrs = ["192.168.1.20:7777"]

[[folders]]
id = "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
path = "/srv/shoal/photos"
mode = "full"
members = ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
retention_days = 30
scan_interval_secs = 10
# On a laptop, keep only recently opened files (a partial replica) and show the whole folder
# at a mount point with FUSE (Linux only):
# mode = "partial"
# budget_bytes = 10000000000
# mount = "/home/me/Shoal/Photos"
# To only send this device's files and never write other devices' changes here, and to keep
# files deleted here on every other device:
# direction = "send-only"
# local_deletes = "this-device"
# To encrypt the folder, so storage peers can hold it without reading it (ADR 0023). Every
# replica needs this from the start:
# [folders.encryption]
# storage_peers = ["dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"]

# Optional web peer: sign in from a browser. Create accounts with
# `shoald web account add --data-dir <data_dir> --username <name>`.
[web]
bind = "127.0.0.1:8080"
secure_cookies = true

# Optional: make this device a storage peer, which stores encrypted folders for other users
# without being able to read them (ADR 0023). Their devices list this device's ID as a storage
# peer of the folder.
# [[storage.folders]]
# id = "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
# members = ["ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"]
# quota_bytes = 100000000000
# retention_days = 30
