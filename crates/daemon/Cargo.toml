[package]
name = "tidefell-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tidefell: binary `tidefelld`: headless peer for Linux servers and NAS"
publish = false

[[bin]]
name = "tidefelld"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
getrandom.workspace = true
tidefell-api.workspace = true
tidefell-sdk.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tidefell-engine.workspace = true
tidefell-identity.workspace = true
tidefell-proto.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
