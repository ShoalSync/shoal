[package]
name = "shoal-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shoal: binary `shoald`: headless peer for Linux servers and NAS"
publish = false

[[bin]]
name = "shoald"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
getrandom.workspace = true
shoal-api.workspace = true
shoal-sdk.workspace = true
shoal-web.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shoal-engine.workspace = true
shoal-identity.workspace = true
shoal-proto.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
shoal-fs-fuse.workspace = true

[target.'cfg(windows)'.dependencies]
shoal-fs-cfapi.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
