{% extends "base.html" %}
{% block title %}Password needed · Tidefell{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Password needed</h1>
  <p class="muted">Enter the password you were given for this link.</p>
  {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/s/{{ token }}" hx-boost="false">
    <label>Password <input name="password" type="password" autocomplete="off" required autofocus></label>
    <button type="submit">Open</button>
  </form>
</section>
{% endblock %}
