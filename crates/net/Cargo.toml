[package]
name = "shoal-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shoal: iroh endpoint, relay config, address lookup, sync/1 protocol"
publish = false

[lints]
workspace = true

[features]
# An in-memory network in place of iroh, for simulation tests (ADR 0036).
simulation = []

[dependencies]
blake3.workspace = true
iroh = { workspace = true, features = ["unstable-net-report"] }
iroh-mdns-address-lookup.workspace = true
iroh-metrics.workspace = true
ipnet.workspace = true
netwatch.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
shoal-identity.workspace = true
shoal-proto.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
shoal-meta.workspace = true
