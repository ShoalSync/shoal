# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Workspace crates are `publish = false` and are checked by `cargo xtask check-deps` instead.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained. It is a compile-time proc-macro (no runtime code) reached only
    # through iroh -> netwatch -> netlink-packet-core. Revisit when iroh drops it.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro via iroh, no runtime code" },
    # `basic-toml` is unmaintained. askama's derive macro reads its configuration with it at
    # compile time (askama -> askama_macros -> askama_derive), so no runtime code. Revisit when
    # askama drops it.
    { id = "RUSTSEC-2026-0374", reason = "build-time, via askama's derive macro, no runtime code" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Permissive licences only. Copyleft third-party code would constrain the MIT/Apache crates.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's CA root certificate data (webpki-roots), used by iroh for relay TLS.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Narrow exceptions for weak-copyleft crates. None of them reaches `proto` or `sdk`, so they
# never constrain the MIT/Apache crates.
exceptions = [
    # UPnP port mapping client, via iroh -> portmapper -> igd-next. MPL-2.0 is file-level
    # copyleft and compatible with AGPL-3.0; it only reaches the AGPL `net` crate.
    { crate = "attohttpc", allow = ["MPL-2.0"] },
    # uniffi generates the Kotlin bindings (ADR 0004). Reached only from the AGPL `ffi` crate
    # and from `xtask`, which runs its bindings generator; never from `proto` or `sdk`.
    { crate = "uniffi", allow = ["MPL-2.0"] },
    { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { crate = "uniffi_core", allow = ["MPL-2.0"] },
    { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_meta", allow = ["MPL-2.0"] },
    { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
    { crate = "uniffi_udl", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
